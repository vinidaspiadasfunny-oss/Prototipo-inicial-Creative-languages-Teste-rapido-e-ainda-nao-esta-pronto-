<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creative Languages</title>
  
  <!-- Ícones FontAwesome -->
  <link rel="stylesheet" href="https://cloudflare.com">
  
  <!-- Link para o CSS Externo -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div onclick="showTab('home')" class="logo-container">
      <div class="logo-icon">
        <i class="fas fa-language text-white"></i>
      </div>
      <span class="logo-text">Creative<span>Languages</span></span>
    </div>
    
    <button onclick="toggleMenu()" class="menu-toggle">
      <i class="fas fa-bars"></i>
    </button>

    <!-- Menu Lateral -->
    <div id="sideMenu" class="side-menu">
      <button onclick="toggleMenu()" class="close-menu"><i class="fas fa-times"></i></button>
      <button onclick="showTab('home')" class="menu-btn"><i class="fas fa-home"></i> Início</button>
      <button onclick="showTab('perfil')" class="menu-btn"><i class="fas fa-user"></i> Perfil</button>
      <button onclick="showTab('comunidade')" class="menu-btn"><i class="fas fa-users"></i> Comunidade</button>
      <button onclick="showTab('voz')" class="menu-btn"><i class="fas fa-microphone"></i> Detectar Voz</button>
      <button onclick="showTab('atividades')" class="menu-btn"><i class="fas fa-tasks"></i> Atividades</button>
    </div>
  </nav>

  <div id="menuOverlay" onclick="toggleMenu()" class="overlay"></div>

  <main class="container">
    
    <!-- ABA TRADUTOR & IA -->
    <div id="tab-home" class="tab-content active-grid grid-layout">
      
      <!-- QUADRO TRADUTOR -->
      <div class="glass-card">
        <h2 class="card-title"><i class="fas fa-globe purple-icon"></i> Tradutor Instantâneo</h2>
        
        <div class="lang-selector-group">
          <select id="fromLang">
            <option value="pt" selected>🇧🇷 Português</option>
            <option value="en">🇺🇸 Inglês</option>
            <option value="es">🇪🇸 Espanhol</option>
            <option value="fr">🇫🇷 Francês</option>
            <option value="de">🇩🇪 Alemão</option>
            <option value="it">🇮🇹 Italiano</option>
          </select>
          
          <button onclick="swapLanguages()" class="swap-btn">
            <i class="fas fa-exchange-alt"></i>
          </button>
          
          <select id="toLang">
            <option value="pt">🇧🇷 Português</option>
            <option value="en" selected>🇺🇸 Inglês</option>
            <option value="es">🇪🇸 Espanhol</option>
            <option value="fr">🇫🇷 Francês</option>
            <option value="de">🇩🇪 Alemão</option>
            <option value="it">🇮🇹 Italiano</option>
          </select>
        </div>

        <textarea id="inputText" rows="4" placeholder="Digite seu texto aqui..."></textarea>
        
        <button onclick="traduzir()" class="btn-primary btn-purple">TRADUZIR CONTEÚDO</button>

        <textarea id="outputText" rows="4" readonly class="output-box" placeholder="A tradução aparecerá aqui..."></textarea>
      </div>

      <!-- QUADRO IA -->
      <div class="glass-card">
        <h2 class="card-title"><i class="fas fa-robot fuchsia-icon"></i> Copiloto de IA</h2>
        <textarea id="iaInput" rows="4" placeholder="Faça qualquer pergunta para a IA..."></textarea>
        <button onclick="chamarIA()" class="btn-primary btn-fuchsia">REFINAR COM IA</button>
        <div id="iaResponse" class="ia-response-box">Aguardando comandos para otimização...</div>
      </div>

    </div>

    <!-- SEÇÃO DE ESPERA GERAL -->
    <div id="tab-dev" class="tab-content dev-screen glass-card">
      <div class="dev-icon-box">
        <i class="fas fa-screwdriver-wrenches"></i>
      </div>
      <h2>Ops! Ainda está sendo feito!</h2>
      <p>Melhor esperar um pouquinho!</p>
      <button onclick="showTab('home')" class="btn-back">Voltar para o Início</button>
    </div>

  </main>

  <!-- Link para o JS Externo -->
  <script src="script.js"></script>
</body>
</html>
